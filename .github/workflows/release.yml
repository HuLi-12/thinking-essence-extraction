name: Release Skill Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validate package
        run: python scripts/validate_skill_package.py

      - name: Create release zip
        run: |
          # Package the full repository — the skill folder is the install unit
          cd "$GITHUB_WORKSPACE"
          zip -r "thinking-essence-extraction.zip" \
            README.md install.md CHANGELOG.md CONTRIBUTING.md LICENSE \
            skills/ wrappers/ scripts/ install/ .github/workflows/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: thinking-essence-extraction.zip
